# =============================================================================
# GeoSentry-SOTA master configuration
# All paths are relative to the project root (the folder holding main.py).
# =============================================================================

project:
  name: GeoSentry-SOTA
  # Project CRS. UTM 32N is valid for 6E to 12E (central Nigeria:
  # Jos Plateau, Nasarawa, Kaduna, Kogi east of 6E). For AOIs west of 6E use
  # EPSG:32631, east of 12E use EPSG:32633 (only these three are accepted).
  # The harmonizer warns if the AOI centroid falls outside the zone.
  crs: "EPSG:32632"
  resolution_m: 10.0
  # Target grid extent: "intersection" of all inputs, "union", or explicit
  # [xmin, ymin, xmax, ymax] in the project CRS.
  extent: intersection
  seed: 42

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  labels_dir: data/labels
  stack: data/processed/stack_11ch.tif
  valid_mask: data/processed/valid_mask.tif
  scaling_stats: data/processed/scaling_stats.json
  target_mask: data/labels/target_mask.tif          # 1 = target, 0 = background, 255 = ignore
  positives_csv: data/labels/known_occurrences.csv  # columns: lon, lat (WGS 84), optional: name, commodity
  models_dir: outputs/models
  ssl_weights: outputs/models/ssl_encoder.pt
  stage1_weights: outputs/models/attention_unet_best.pt
  stage1_features: outputs/rasters/stage1_features.tif
  prospectivity: outputs/rasters/prospectivity.tif
  reports_dir: outputs/reports

# -----------------------------------------------------------------------------
# Raw input layers. "kind" drives resampling and scaling:
#   optical  -> bilinear, percentile MinMax to [0, 1]
#   sar      -> bilinear, converted to dB if linear, percentile MinMax to [0, 1]
#   geophys  -> cubic + Gaussian de-blocking, robust Z-score
#   dem      -> bilinear, converted to slope in degrees, percentile MinMax
# Set to_db: true for Sentinel-1 GRD delivered in linear power.
# Set compute_1vd: true if the magnetic grid is total magnetic intensity (TMI)
# rather than an already computed 1st vertical derivative.
# -----------------------------------------------------------------------------
layers:
  s2_b02: {path: data/raw/S2_B02.tif, kind: optical}
  s2_b03: {path: data/raw/S2_B03.tif, kind: optical}
  s2_b04: {path: data/raw/S2_B04.tif, kind: optical}
  s2_b08: {path: data/raw/S2_B08.tif, kind: optical}
  s2_b11: {path: data/raw/S2_B11.tif, kind: optical}   # used only for the hydroxyl index
  s2_b12: {path: data/raw/S2_B12.tif, kind: optical}   # used only for the hydroxyl index
  s1_vv:  {path: data/raw/S1_VV.tif,  kind: sar, to_db: true}
  s1_vh:  {path: data/raw/S1_VH.tif,  kind: sar, to_db: true}
  mag:    {path: data/raw/MAG_TMI.tif, kind: geophys, compute_1vd: true, smooth_sigma_px: 2.0}
  th:     {path: data/raw/RAD_eTh.tif, kind: geophys, smooth_sigma_px: 2.0}
  dem:    {path: data/raw/DEM.tif,     kind: dem}

# Order of the 11 output channels. Do not reorder after training.
channels:
  - B2_blue
  - B3_green
  - B4_red
  - B8_nir
  - S1_VV_dB
  - S1_VH_dB
  - OH_alteration
  - NDVI
  - MAG_1VD
  - RAD_eTh
  - DEM_slope

scaling:
  clip_percentiles: [2.0, 98.0]      # optical / SAR / index / slope
  zscore_clip_percentiles: [0.5, 99.5]
  zscore_limit: 5.0                  # final Z values clipped to [-5, 5]

# -----------------------------------------------------------------------------
# Stage 1: self-supervised pretraining + attention U-Net segmentation
# -----------------------------------------------------------------------------
stage1:
  patch_size: 256
  stride: 128
  min_valid_fraction: 0.6
  positive_oversample: 4             # extra draws of patches that contain targets
  base_channels: 32
  depth: 4
  latent_channels: 8                 # per-pixel embedding exported to Stage 2
  dropout: 0.1
  batch_size: 8
  epochs: 60
  lr: 3.0e-4
  weight_decay: 1.0e-4
  num_workers: 0                     # >0 works on Windows, but start with 0
  val_block_px: 1024                 # spatial block size for leakage-free validation
  val_fraction: 0.2
  allow_random_split: false          # true = DEVELOPMENT ONLY if the AOI is too small for blocks
  freeze_encoder_epochs: 3
  early_stop_patience: 12
  loss:
    focal_alpha: 0.85
    focal_gamma: 2.0
    dice_weight: 1.0
    focal_weight: 1.0
  ssl:
    epochs: 40
    lr: 5.0e-4
    mask_patch: 16
    mask_ratio: 0.6
    channel_drop_prob: 0.3           # whole-modality masking for cross-modal learning
  inference:
    overlap: 64
    tta: true

# -----------------------------------------------------------------------------
# Stage 2: Positive-Unlabeled XGBoost prospectivity
# -----------------------------------------------------------------------------
stage2:
  # Case-insensitive substring matched against the CSV "commodity" column.
  # Run lithium pegmatites and REE as separate mineral systems, e.g. "Li" or "REE".
  # null = use every occurrence.
  commodity_filter: null
  positive_buffer_px: 2              # pixels around each occurrence counted as positive
  exclusion_radius_m: 500            # unlabeled samples are drawn outside this radius
  unlabeled_samples: 60000
  bags: 50
  unlabeled_per_bag_ratio: 1.0       # |U_bag| = ratio * |P|
  xgb:
    n_estimators: 400
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 2
    reg_lambda: 1.0
    tree_method: hist
  shap_samples: 3000
  predict_block: 1024
  target_top_area: 0.02              # targets = connected clusters in the top 2 % of AOI area

# -----------------------------------------------------------------------------
# Nested geographic evaluation (the only source of performance numbers)
# -----------------------------------------------------------------------------
evaluation:
  outer_folds: 5
  block_m: 5000                      # fold blocks; whole blocks go to one fold
  dead_zone_m: 1000                  # gap between test area and any training cell
  cluster_radius_m: 500              # occurrences closer than this form one cluster
  occurrence_buffer_m: 50            # positional uncertainty for "target hits occurrence"
  ssl_mode: transductive             # transductive (SSL sees test imagery, never labels) or none
  methods: [two_stage, stage1_only, pu_xgb_physical, pu_logreg_physical]
  seeds: [42]                        # add seeds, e.g. [42, 7, 2026], to measure seed variance
  bootstrap: 2000
  logreg_C: 1.0
